<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bishnupriya Manipuri to Roman</title>
<meta name="description" content="Type or paste Bengali script and get Roman letters. Works offline.">
<meta name="theme-color" content="#7a2e4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bn to Roman">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>&#x09AC;&#x09BF;&#x09B7;&#x09CD;&#x09A3;&#x09C1;&#x09AA;&#x09CD;&#x09B0;&#x09BF;&#x09AF;&#x09BC;&#x09BE;&#x0020;&#x09AE;&#x09A8;&#x09BF;&#x09AA;&#x09C1;&#x09B0;&#x09BF; <span aria-hidden="true">&rarr;</span> Roman</h1>
  <button id="status" type="button" hidden></button>
</header>
<main>
  <textarea id="text" aria-label="Type or paste Bishnupriya Manipuri (Bengali) script; the text becomes Roman letters"
            placeholder="Type or paste Bishnupriya Manipuri (Bengali) script, e.g. আমার ইমাঠার বিষ্ণুপ্রিয়া মনিপুরি"
            autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
</main>
<noscript><p class="nojs">This app needs JavaScript.</p></noscript>

<!-- Only one file from translit-js-reverse is used at runtime: its dist bundle. -->
<script src="vendor/translit-reverse.min.js"></script>
<script src="inplace.js"></script>
<script src="app.js"></script>
</body>
</html>
