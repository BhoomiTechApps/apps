<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eastern Nagari to Roman</title>
<meta name="description" content="Type or paste Eastern Nagari script and get Roman letters. Works offline.">
<meta name="theme-color" content="#d8d5ce">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bn to Roman">
<link rel="preload" href="vendor/onest/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- The BhoomiTech frame: header line with the app name and version, the app on an inset stage, the credit line. -->
<div class="tr-frame tr-theme-light">
  <div class="tr-frame-head">
    <span class="tr-frame-brand">Eastern Nagari to Roman <span class="tr-frame-ver" data-app-version></span></span>
  </div>
  <div class="tr-stage">
    <header class="tr-appbar">
      <h1>&#x09AA;&#x09C2;&#x09B0;&#x09CD;&#x09AC;&#x09CD;&#x09AC; &#x09A8;&#x09BE;&#x0997;&#x09F0;&#x09C0; <span aria-hidden="true">&rarr;</span> Roman</h1>
      <div class="tools">
        <button id="status" type="button" hidden></button>
        <button id="ocr-btn" type="button" title="Open the OCR tool in a separate small window">OCR<svg class="tr-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 4h6v6M20 4l-8 8M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg></button>
      </div>
    </header>
    <main>
    <textarea id="text" aria-label="Type or paste Bishnupriya Manipuri (Bengali) script; the text becomes Roman letters"
            placeholder="Type or Paste Eastern Nagari (Assamese / Bengali) script, e.g. আমাৰ লিপি পূর্ব্ব নাগৰী"
            autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      <noscript><p class="nojs">This app needs JavaScript.</p></noscript>
    </main>
  </div>
  <div class="tr-frame-foot">Web Application developed by <strong>Shankar Sinha</strong> for <strong>BhoomiTech Heritage and Development Foundation</strong> under <strong>CDEP</strong></div>
</div>

<!-- One file from translit-js-reverse is used at runtime (its dist bundle); mapping.js (the data) and rules.js (the glue) add the Bishnupriya mapping on top of it. -->
<script src="guard.js"></script>
<script src="version.js"></script>
<script src="vendor/translit-reverse.min.js"></script>
<script src="mapping.js"></script>
<script src="rules.js"></script>
<script src="inplace.js"></script>
<script src="app.js"></script>
</body>
</html>
