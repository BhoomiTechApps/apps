<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eastern Nagari to Roman</title>
<meta name="description" content="Type or paste Eastern Nagari (Assamese / Bengali) script and get Roman letters. Works offline.">
<meta name="theme-color" content="#7a2e4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bn to Roman">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>&#x09AA;&#x09C2;&#x09B0;&#x09CD;&#x09AC;&#x09CD;&#x0020;&#x09A8;&#x09BE;&#x0997;&#x09F0;&#x09C0; <span aria-hidden="true">&rarr;</span> Roman</h1>
  <div class="tools">
    <button id="status" type="button" hidden></button>
    <button id="ocr-btn" type="button" title="Open the OCR tool in a separate small window">OCR</button>
  </div>
</header>
<main>
  <textarea id="text" aria-label="Type or paste Eastern Nagari (Assamese / Bengali) script; the text becomes Roman letters"
            placeholder="Type or paste Eastern Nagari (Assamese / Bengali), e.g. আমাৰ লিপি পূর্ব্ব নাগৰী"
            autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
</main>
<noscript><p class="nojs">This app needs JavaScript.</p></noscript>

<!-- Only one file from translit-js-reverse is used at runtime: its dist bundle. -->
<script src="vendor/translit-reverse.min.js"></script>
<script src="inplace.js"></script>
<script src="app.js"></script>
</body>
</html>
