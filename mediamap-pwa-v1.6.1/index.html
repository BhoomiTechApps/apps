<!doctype html>
<html lang="en" data-mm-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Media Map</title>
<meta name="description" content="Pin photos, video, audio, documents and notes to places, with your own map layers. Everything is saved on your device.">
<meta name="theme-color" content="#d8d5ce">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Media Map">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<link rel="preload" href="vendor/onest/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/leaflet/leaflet.min.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.Default.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="mm-page">

<!-- The BhoomiTech frame: name and version at top right, the app on an inset stage, the credit line.
     The overlays (welcome, photo, toast, PDF reader, form window) also live inside it, so they use its theme. -->
<div class="mm-frame mm-theme-light" id="mm-frame">
<script>
/* Theme before the first paint: Light unless this device chose Dark in Settings; ?theme=dark|light in the
   address overrides it for that visit only (handy for a shared link). js/app.js has the same rules. */
( function () {
    var t = 'light', q = /[?&]theme=(dark|light)(?:&|$)/.exec( location.search );
    try { var s = localStorage.getItem( 'mediamap_theme' ); if ( s === 'dark' || s === 'light' ) t = s; } catch ( e ) {}
    if ( q ) t = q[ 1 ];
    document.getElementById( 'mm-frame' ).className = 'mm-frame mm-theme-' + t;
    document.documentElement.setAttribute( 'data-mm-theme', t );
    document.querySelector( 'meta[name=theme-color]' ).content = t === 'dark' ? '#1d1e20' : '#d8d5ce';
    document.querySelector( 'meta[name=color-scheme]' ).content = t;
}() );
</script>
<div class="mm-frame-head">
    <span class="mm-frame-brand">Media Map <span class="mm-frame-ver" data-app-version></span></span>
</div>

<div class="mm-stage">
<header class="bar">
    <a class="brand" href="./" aria-label="Media Map home">
        <svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 21s-6.5-6.2-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.3"/></svg>
        <span>Media Map</span>
    </a>
    <button type="button" class="where" id="where" hidden title="Where your data is saved">
        <svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2h7.2a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
        <span id="where-name"></span>
    </button>
    <span class="offline-chip" id="offline-chip" hidden>Offline</span>
    <nav class="bar-actions">
        <button type="button" class="icon-btn" id="btn-list" aria-label="Entries" title="Entries" aria-pressed="false">
            <svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01" stroke-width="2.4"/></svg>
        </button>
        <button type="button" class="icon-btn" id="btn-layers" aria-label="Map layers" title="Map layers" aria-pressed="false">
            <svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 4 8.5 4.5L12 13 3.5 8.5z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5"/><path d="m3.5 16.2 8.5 4.3 8.5-4.3"/></svg>
        </button>
        <button type="button" class="icon-btn" id="btn-settings" aria-label="Settings" title="Settings" aria-pressed="false">
            <svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>
        </button>
    </nav>
</header>

<main class="stage">
    <div id="map" role="application" aria-label="Map"></div>

    <div class="pick-hint" id="pick-hint" hidden>Tap the map to place the pin</div>

    <div class="fabs">
        <button type="button" class="fab fab-small" id="btn-locate" aria-label="Show my location" title="Show my location">
            <svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
        </button>
        <button type="button" class="fab fab-add" id="btn-add">
            <svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
            <span>Add a place</span>
        </button>
    </div>

    <aside class="sheet" id="sheet" hidden aria-labelledby="sheet-title">
        <div class="sheet-head">
            <button type="button" class="icon-btn sheet-back" id="sheet-back" hidden aria-label="Back">
                <svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14.5 6 8.5 12l6 6"/></svg>
            </button>
            <h2 id="sheet-title"></h2>
            <button type="button" class="icon-btn" id="sheet-close" aria-label="Close">
                <svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
    </aside>
</main>
</div>

<div class="mm-frame-foot">Web Application developed by <strong>Shankar Sinha</strong> for <strong>BhoomiTech Heritage and Development Foundation</strong> under <strong>CDEP</strong></div>

<section class="welcome" id="welcome" hidden aria-labelledby="welcome-title">
    <div class="welcome-card" id="welcome-card"></div>
</section>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo">
    <button type="button" class="icon-btn lightbox-close" aria-label="Close">
        <svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <img alt="">
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<input type="file" id="import-input" accept=".zip,.json,.geojson,application/zip,application/json,application/geo+json" hidden>

<noscript><p class="noscript">Media Map needs JavaScript to run.</p></noscript>

<script src="js/guard.js"></script>
<script src="js/version.js"></script>
<script src="vendor/leaflet/leaflet.min.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
