<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="theme-color" content="#2c3e50">
    <title>Street View Fullscreen</title>
	<link rel="manifest" href="manifest.json">
	<link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="leaflet/leaflet.css" />
    <link rel="stylesheet" href="fontas/all.min.css">
	<link rel="stylesheet" href="leaflet/Control.Geocoder.css" />
	<link rel="stylesheet" href="res/style.css" />
	
	<script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW Registered'))
                    .catch(err => console.log('SW Failed', err));
            });
        }
    </script>
	
</head>
<body>

<div id="toolbar" class="collapsed">
    <div id="toolbarHeader" onclick="toggleToolbar()">
        <span>Street View Controller</span>
        <span id="chevron"><i class="fa-solid fa-chevron-down"></i></span>
    </div>
    <div id="toolbarContent">
        <div class="toolbar-inline-row">
            <div id="searchContainer"></div>
			<div id="coords">Click on map to select location</div>
        </div>
    </div>
</div>

<div id="map"></div>

<div id="streetviewContainer">
    <button id="closeSV" class="sv-btn" onclick="closeStreetView()">
        <i class="fa-solid fa-xmark"></i>
    </button>
    <iframe id="streetview"></iframe>
</div>

<script src="leaflet/leaflet.js"></script>
<script src="leaflet/Control.Geocoder.js"></script>
<script src="res/code.js"></script>

</body>
</html>
