<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roman to Eastern Nagari</title>
<meta name="description" content="Type in Roman letters and get Eastern Nagari (Assamese / Bengali) script as you type. Works offline.">
<meta name="theme-color" content="#d8d5ce">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Translit">
<link rel="preload" href="vendor/onest/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- The BhoomiTech frame: header line with the app name and version, the app on an inset stage, the credit line. -->
<div class="tr-frame tr-theme-light">
  <div class="tr-frame-head">
    <span class="tr-frame-brand">Roman to Eastern Nagari <span class="tr-frame-ver" data-app-version></span></span>
  </div>
  <div class="tr-stage">
    <header class="tr-appbar">
      <h1>Roman <span aria-hidden="true">&rarr;</span> &#x09AA;&#x09C2;&#x09B0;&#x09CD;&#x09AC;&#x09CD;&#x0020;&#x09A8;&#x09BE;&#x0997;&#x09F0;&#x09C0;</h1>
      <div class="tools">
        <button id="status" type="button" hidden></button>
        <button id="chart-btn" type="button" lang="bn" aria-controls="chart" aria-expanded="false" title="Show the barnamala chart of Roman keys">&#x09AC;&#x09B0;&#x09CD;&#x09A3;&#x09AE;&#x09BE;&#x09B2;&#x09BE;</button>
      </div>
    </header>
    <main>
      <textarea id="text" aria-label="Type in Roman letters; the text becomes Eastern Nagari (Assamese / Bengali) script"
                placeholder="Type in Roman, e.g. amar lipi purrbbo nagorI"
                autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      <noscript><p class="nojs">This app needs JavaScript.</p></noscript>
    </main>
  </div>
  <div class="tr-frame-foot">Web Application developed by <strong>Shankar Sinha</strong> for <strong>BhoomiTech Heritage and Development Foundation</strong> under <strong>CDEP</strong></div>

  <!-- The barnamala chart: a small window that floats above the page. Built and wired up in app.js.
       It sits inside the frame so it uses the frame's theme tokens. -->
  <aside id="chart" class="chart" aria-label="Barnamala chart of Roman keys" hidden>
    <div id="chart-bar" class="chart-bar">
      <span class="chart-title" lang="bn">&#x09AC;&#x09B0;&#x09CD;&#x09A3;&#x09AE;&#x09BE;&#x09B2;&#x09BE;</span>
      <button id="chart-close" type="button" aria-label="Close the barnamala chart"><svg class="tr-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="chart-body" class="chart-body" tabindex="0"></div>
  </aside>
</div>

<!-- Only one file from translit-js-forward is used at runtime: its dist bundle. -->
<script src="guard.js"></script>
<script src="version.js"></script>
<script src="vendor/translit-forward.min.js"></script>
<script src="fixes.js"></script>
<script src="inplace.js"></script>
<script src="barnamala.js"></script>
<script src="panel.js"></script>
<script src="app.js"></script>
</body>
</html>
