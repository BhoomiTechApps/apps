<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a"> <title>TabEdit | GeoJSON Schema Editor</title>
    
    <link rel="manifest" href="manifest.json">
    
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW Registered'))
                    .catch(err => console.log('SW Failed', err));
            });
        }
    </script>
</head>

<body>

    <header class="header-bar" onclick="toggleToolbar()">
      <div class="brand-wrapper">
          <h1><i class="fas fa-layer-group"></i> TabEdit</h1>
          <i class="fas fa-chevron-down" id="chevron-icon"></i>
      </div>
      <button class="btn-open" onclick="event.stopPropagation(); openGeoJSON()">
          <i class="fas fa-folder-open"></i>&nbsp; Open
      </button>
    </header>

    <div id="toolbelt" class="secondary-toolbar">
        <button class="btn-tool" onclick="addColumn()"><i class="fas fa-plus"></i>&nbsp; Add Column</button>
        <button class="btn-tool" onclick="saveGeoJSON()" style="background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0;">
            <i class="fas fa-check-double"></i>&nbsp; Save & Overwrite
        </button>
		<button class="btn-tool" onclick="unloadData()" style="color: #ef4444;">
            <i class="fas fa-power-off"></i>&nbsp; Unload
        </button>
        <div id="status" style="font-size: 0.7rem; color: #94a3b8; margin-left: auto;">No active file</div>
    </div>

    <main class="workspace">
        <div class="column-manager">
            <h3>Properties Schema</h3>
            <div id="columnList">
                <p style="font-size: 0.8rem; color: #94a3b8;">Load a GeoJSON to view keys...</p>
            </div>
        </div>
        <div class="json-preview">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 10px; color: #475569;">
                <span>RAW SOURCE (LOCKED)</span>
                <i class="fas fa-copy" style="cursor: pointer;" title="Copy to clipboard" onclick="copyJSON()"></i>
            </div>
            <pre id="jsonDisplay">// Awaiting data...</pre>
        </div>
    </main>

<script src="script.js"></script>

</body>
</html>
