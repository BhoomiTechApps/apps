<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1923" />
  <meta name="description" content="GeoJSON Map Viewer" />
  <link rel="manifest" href="manifest.json" />
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <title>GeoViewer</title>

  <link rel="stylesheet" href="res/leaflet.css" />
  <script src="res/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="res/style.css" />
</head>
<body>

<div id="drop-overlay">
  <div class="drop-icon">🗺️</div>
  <div>Drop GeoJSON to load</div>
</div>

<header>
  <div class="logo">Geo<span>Viewer</span></div>
  <div class="header-controls">
    <select id="basemap-select" title="Choose basemap">
      <option value="osm">OpenStreetMap</option>
      <option value="carto-dark" selected>Carto Dark</option>
      <option value="carto-light">Carto Light</option>
      <option value="esri-topo">ESRI Topo</option>
      <option value="esri-imagery">ESRI Imagery</option>
      <option value="google-terrain">Google Terrain</option>
      <option value="cycle">OpenCycleMap</option>
	  <option value="google-street">Google Street</option>
	  <option value="google-hybrid">Google Hybrid</option>
      <option value="blank">Blank</option>
    </select>
    <label class="btn">
      ＋ Load GeoJSON
      <input type="file" accept=".geojson,.json" multiple id="file-input" />
    </label>
  </div>
  <button class="toggle-panel-btn" id="toggle-panel">◧ Panel</button>
</header>

<div class="app">
  <div id="map"></div>
  <div id="panel">

    <div class="panel-tabs">
      <button class="tab-btn active" data-tab="info">Feature Info</button>
      <button class="tab-btn" data-tab="layers">Layers <span class="tab-badge" id="layer-count">0</span></button>
    </div>

    <div class="tab-pane active" id="tab-info">
      <div class="panel-body" id="panel-body">
        <div class="empty-state">
          <div class="empty-icon">📍</div>
          <p>Click any feature on the map to view its properties here.</p>
          <p style="font-size:.65rem;margin-top:8px;">Load a GeoJSON via the button above or drag & drop.</p>
        </div>
      </div>
    </div>

    <div class="tab-pane layer-list-pane" id="tab-layers">
      <div id="layer-list">
        <div class="layer-list-empty">
          <div class="empty-icon">🗂️</div>
          <p>No layers loaded yet. Load a GeoJSON file to get started.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="res/code.js"></script>
</body>
</html>
