<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>Mapper</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="fontas/all.min.css">

  <link rel="stylesheet" href="leaflet/leaflet.css" />
  <script src="leaflet/leaflet.js"></script>

  <link rel="stylesheet" href="leaflet/leaflet-measure.css">
  <script src="leaflet/leaflet-measure.js"></script>

  <link rel="stylesheet" href="leaflet/leaflet-routing-machine.css" />
  <script src="leaflet/leaflet-routing-machine.js"></script>

  <link rel="stylesheet" href="leaflet/L.Control.Locate.min.css" />
  <script src="leaflet/L.Control.Locate.min.js"></script>

  <link rel="stylesheet" href="leaflet/Control.FullScreen.css" />
  <script src="leaflet/Control.FullScreen.js"></script>

  <script src="leaflet-ext/leaflet.markercluster.js"></script>
  <link rel="stylesheet" href="leaflet-ext/MarkerCluster.css" />
  <link rel="stylesheet" href="leaflet-ext/MarkerCluster.Default.css" />
  <script src="leaflet-ext/leaflet-heat.js"></script>
  <script src="leaflet-ext/turf.min.js"></script>

  <script src="geofile/togeojson/togeojson.umd.js"></script>
  <script src="geofile/jszip.min.js"></script>

  <link rel="stylesheet" href="res/mapstyle.css">
  
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { scope: '/apps/mapview/' })
	.then(registration => {
	  console.log('SW registered with scope:', registration.scope);
	})
	.catch(error => {
	  console.error('SW registration failed:', error);
	})
  }
</script>

</head>

<body>

  <div id="map"></div>

  <button id="panelToggle" onclick="togglePanel()">☰ Menu</button>

  <div id="toolbar">
    <div style="display: flex; gap: 6px; width: 100%; margin-bottom: 8px;">
      <button onclick="saveProject()">Save Project</button>
      <input type="file" id="loadProjectFile" style="display:none" onchange="loadProject(this.files[0])">
      <button onclick="document.getElementById('loadProjectFile').click()">Load Project</button>
    </div>

    <div style="width:100%; margin-bottom: 12px;">
      <input type="file" id="fileInput" multiple style="display:none">
      <button style="width:100%;" onclick="document.getElementById('fileInput').click()">
        Add Geojson/KMZ/KML Layers
      </button>
    </div>

    <div id="searchSection">
      <div style="display: flex; gap: 6px; width: 100%;">
        <input type="text" id="searchText" placeholder="Search...">
        <select id="searchSource">
          <option value="locationiq">LocationIQ</option>
          <option value="google">Google</option>
          <option value="layers">Loaded Layers</option>
        </select>
      </div>
      <div style="display: flex; gap: 6px; width: 100%; margin-top: 6px;">
        <button onclick="clearSearch()">Clear</button>
        <button id="searchBtn" style="flex-grow: 1;" onclick="doSearch()">Search</button>
      </div>
    </div>

    <div id="searchResults" style="max-height:100px; overflow-y:auto; font-size:12px; margin-top: 8px;"></div>

    <div id="navPanel" style="display:none; margin-top:8px; margin-bottom:8px; font-size:12px; border:1px solid #ccc; padding:6px; border-radius:6px;">
      <div><strong>Navigation</strong></div>
      <div id="waypointsInfo"></div>
      <div style="margin-top:4px;">
        Speed: <input type="range" id="speedRange" min="10" max="200" value="40" step="1">
        <span id="speedLabel">40 km/h</span>
      </div>
      <div id="travelTimeInfo" style="margin-top:4px;"></div>
      <div id="altRoutesContainer" style="margin-top:6px;"></div>
      <div id="turnByTurnContainer" style="margin-top:6px; max-height:150px; overflow-y:auto; font-size:12px;"></div>
      <div style="margin-top:6px;">
        <button id="clearAllRoutesBtn" class="btn" style="width:100%;">Clear All Routes</button>
      </div>
    </div>

    <hr>
    <div id="layerList"></div>
  </div>

  <div id="styleModalBackdrop" class="modal-backdrop" style="display:none">
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="modalTitle">Layer Style</h3>

      <div class="form-row">
        <label>Color</label>
        <input id="modalColor" type="color" value="#3388ff">
      </div>
      <div class="form-row">
        <label>Opacity</label>
        <input id="modalOpacity" type="range" min="0" max="1" step="0.1" value="0.9">
      </div>
      <div class="form-row">
        <label>Line weight</label>
        <input id="modalWeight" type="number" value="2" style="width:70px">
      </div>

      <hr>
      <strong>Labels</strong>
      <div class="form-row">
        <label>Enable</label>
        <input id="modalLabelEnable" type="checkbox">
      </div>
      <div class="form-row">
        <label>Label field</label>
        <select id="modalLabelField"></select>
      </div>
      <div class="form-row">
        <label>Font size</label>
        <input id="modalLabelSize" type="number" value="12" style="width:70px"> px
      </div>
      <div class="form-row">
        <label>Font color</label>
        <input id="modalLabelColor" type="color" value="#222222">
      </div>
      <div class="form-row">
        <label>Label halo</label>
        <input id="modalLabelHalo" type="checkbox">
      </div>

      <hr>
      <strong>Advanced</strong>
      <div class="form-row">
        <label>Clustering</label>
        <input id="modalCluster" type="checkbox">
      </div>
      <div class="form-row">
        <label>Heatmap</label>
        <input id="modalHeat" type="checkbox">
      </div>

      <hr>
      <strong>Popup Attributes</strong>
      <ul id="modalAttributeList" style="list-style:none; padding:0; margin:6px 0;"></ul>

      <div style="text-align:right; margin-top:10px">
        <button class="btn" onclick="applyStyleModal(true)">Apply & Close</button>
        <button class="btn" onclick="closeStyleModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="res/mapapp.js"></script>
  <script src="res/maproute.js"></script>
  <script>
    function togglePanel() {
      document.getElementById("toolbar").classList.toggle("open");
    }
  </script>

</body>

</html>
