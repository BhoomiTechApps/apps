<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bishnupriya Manipuri IME</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<!-- <link rel="stylesheet" href="assets/css/style-kp.css"> -->
<link rel="stylesheet" href="assets/css/style-noto.css">
</head>
<body>
<header>Bishnupriya Manipuri IME</header>
<main>
  <div class="container">
    <div class="buttons">
	  <button id="clearBtn">Clear</button>
	  <button id="helpBtn">Help</button>
    </div>
    <div class="textarea-wrapper" style="position: relative;">
      <textarea id="input" placeholder="Type Roman script here..."></textarea>
    </div>
	<div id="recorderBar" class="recorder-bar hidden">
        <div class="rec-controls">
          <button id="startRec">🎤</button>
          <button id="stopRec" disabled>⏹️</button>
		  <canvas width="200" id="audioVisualizer"></canvas>
        </div>
      </div>
	<div align="center">  
	  <audio id="audioPreview" controls></audio> 
    </div>		
    <div class="reverse-wrapper">
      <textarea id="reverseOutput" readonly placeholder="Reversed Roman script will appear here..."></textarea>
    </div>
  <button id="uploadBtn">Submit Scripts & Recording</button>
</main>
<div id="helpModal" class="modal">
  <div class="modal-content">
    <button id="closeHelpModal" class="close-btn">✕</button>
    <div id="helpContainer" class="modal-body"></div>
  </div>
</div>
<script type="module" src="modules/ime/phoneticMap.js"></script>
<script type="module" src="modules/ime/transliterator.js"></script>
<script type="module" src="modules/ime/ime.js"></script>
<script type="module" src="modules/ime/reverseMap.js"></script>
<script type="module" src="modules/ime/reverse.js"></script>
<script type="module" src="modules/ime/utils.js"></script>
<script type="module" src="assets/js/main.js"></script>
<script type="module" src="modules/recorder/recorder.js"></script>
</body>
</html>
