<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0d0a0b"/>
<meta name="description" content="CinemaView — Private Theatre YouTube Player"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="stylesheet" href="style.css"/>
<title>CinemaView</title>
</head>
<body>
<div id="theatre">
  <div id="stage">

    <img id="bg" src="theatre-bg.jpg" alt="" draggable="false"/>

    <div id="theatre-dim"></div>

    <div class="spotlight" id="spot-l">
      <div class="spot-bulb"></div>
      <div class="spot-cone"></div>
    </div>
    <div class="spotlight" id="spot-r">
      <div class="spot-bulb"></div>
      <div class="spot-cone"></div>
    </div>

    <div id="screen-hole">
      <div id="yt-player"></div>
    </div>

	<div id="curtain">
		<div class="curt-panel" id="curt-l">
			<svg class="curt-svg" viewBox="0 0 200 600" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
			<defs>
				<linearGradient id="curtGradL" x1="1" y1="0" x2="0" y2="0">
				<stop offset="0%" stop-color="rgba(20,20,20,0.75)"/>
				<stop offset="40%" stop-color="rgba(30,30,30,0.65)"/>
				<stop offset="100%" stop-color="rgba(15,15,15,0.70)"/>
				</linearGradient>
				<filter id="fabricBlur">
				<feTurbulence type="fractalNoise" baseFrequency="0.025 0.07" numOctaves="4" seed="2" result="noise"/>
				<feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/>
				</filter>
			</defs>
			<rect width="200" height="600" fill="url(#curtGradL)" filter="url(#fabricBlur)"/>

			<!-- light highlight lines (folds) -->
			<g opacity="0.18" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1">
				<line x1="8"   y1="0" x2="6"   y2="600"/>
				<line x1="20"  y1="0" x2="18"  y2="600"/>
				<line x1="38"  y1="0" x2="35"  y2="600"/>
				<line x1="52"  y1="0" x2="49"  y2="600"/>
				<line x1="70"  y1="0" x2="66"  y2="600"/>
				<line x1="88"  y1="0" x2="84"  y2="600"/>
				<line x1="104" y1="0" x2="100" y2="600"/>
				<line x1="120" y1="0" x2="115" y2="600"/>
				<line x1="140" y1="0" x2="135" y2="600"/>
				<line x1="158" y1="0" x2="153" y2="600"/>
				<line x1="172" y1="0" x2="168" y2="600"/>
				<line x1="188" y1="0" x2="184" y2="600"/>
			</g>

			<!-- dark shadow lines (folds) -->
			<g opacity="0.22" fill="none" stroke="rgba(5,5,5,1)" stroke-width="2.5">
				<line x1="14"  y1="0" x2="12"  y2="600"/>
				<line x1="29"  y1="0" x2="26"  y2="600"/>
				<line x1="45"  y1="0" x2="42"  y2="600"/>
				<line x1="61"  y1="0" x2="57"  y2="600"/>
				<line x1="78"  y1="0" x2="74"  y2="600"/>
				<line x1="96"  y1="0" x2="91"  y2="600"/>
				<line x1="112" y1="0" x2="107" y2="600"/>
				<line x1="128" y1="0" x2="123" y2="600"/>
				<line x1="146" y1="0" x2="141" y2="600"/>
				<line x1="163" y1="0" x2="158" y2="600"/>
				<line x1="178" y1="0" x2="173" y2="600"/>
				<line x1="194" y1="0" x2="189" y2="600"/>
			</g>

			<!-- horizontal weave lines -->
			<g opacity="0.06" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.5">
				<line x1="0" y1="30"  x2="200" y2="32"/> <line x1="0" y1="60"  x2="200" y2="58"/>
				<line x1="0" y1="90"  x2="200" y2="92"/> <line x1="0" y1="120" x2="200" y2="118"/>
				<line x1="0" y1="150" x2="200" y2="152"/><line x1="0" y1="180" x2="200" y2="178"/>
				<line x1="0" y1="210" x2="200" y2="212"/><line x1="0" y1="240" x2="200" y2="238"/>
				<line x1="0" y1="270" x2="200" y2="272"/><line x1="0" y1="300" x2="200" y2="298"/>
				<line x1="0" y1="330" x2="200" y2="332"/><line x1="0" y1="360" x2="200" y2="358"/>
				<line x1="0" y1="390" x2="200" y2="392"/><line x1="0" y1="420" x2="200" y2="418"/>
				<line x1="0" y1="450" x2="200" y2="452"/><line x1="0" y1="480" x2="200" y2="478"/>
				<line x1="0" y1="510" x2="200" y2="512"/><line x1="0" y1="540" x2="200" y2="538"/>
				<line x1="0" y1="570" x2="200" y2="572"/>
			</g>

			<!-- animated fabric movement -->
			<g opacity="0.12">
				<path fill="rgba(60,60,60,0.2)">
				<animate attributeName="d" dur="4s" repeatCount="indefinite"
					values="M0,0 C30,100 -20,200 25,300 C-10,400 35,500 0,600 L0,0;
							M0,0 C-20,100 35,200 -15,300 C30,400 -10,500 20,600 L0,0;
							M0,0 C25,100 -15,200 30,300 C-20,400 25,500 -10,600 L0,0;
							M0,0 C-15,100 20,200 -20,300 C35,400 -15,500 25,600 L0,0;
							M0,0 C30,100 -20,200 25,300 C-10,400 35,500 0,600 L0,0"/>
				</path>
				<path fill="rgba(40,40,40,0.15)">
				<animate attributeName="d" dur="5.5s" repeatCount="indefinite"
					values="M200,0 C170,100 220,200 175,300 C210,400 165,500 200,600 L200,0;
							M200,0 C220,100 165,200 215,300 C170,400 210,500 180,600 L200,0;
							M200,0 C175,100 215,200 170,300 C215,400 170,500 205,600 L200,0;
							M200,0 C215,100 175,200 220,300 C175,400 215,500 175,600 L200,0;
							M200,0 C170,100 220,200 175,300 C210,400 165,500 200,600 L200,0"/>
				</path>
			</g>
			<rect x="190" width="10" height="600" fill="rgba(80,80,80,0.15)" filter="url(#fabricBlur)"/>
			</svg>
		</div>
		<div class="curt-panel" id="curt-r">
			<svg class="curt-svg" viewBox="0 0 200 600" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
			<defs>
				<linearGradient id="curtGradL" x1="1" y1="0" x2="0" y2="0">
				<stop offset="0%" stop-color="rgba(20,20,20,0.75)"/>
				<stop offset="40%" stop-color="rgba(30,30,30,0.65)"/>
				<stop offset="100%" stop-color="rgba(15,15,15,0.70)"/>
				</linearGradient>
				<filter id="fabricBlur">
				<feTurbulence type="fractalNoise" baseFrequency="0.025 0.07" numOctaves="4" seed="2" result="noise"/>
				<feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/>
				</filter>
			</defs>
			<rect width="200" height="600" fill="url(#curtGradL)" filter="url(#fabricBlur)"/>

			<!-- light highlight lines (folds) -->
			<g opacity="0.18" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1">
				<line x1="8"   y1="0" x2="6"   y2="600"/>
				<line x1="20"  y1="0" x2="18"  y2="600"/>
				<line x1="38"  y1="0" x2="35"  y2="600"/>
				<line x1="52"  y1="0" x2="49"  y2="600"/>
				<line x1="70"  y1="0" x2="66"  y2="600"/>
				<line x1="88"  y1="0" x2="84"  y2="600"/>
				<line x1="104" y1="0" x2="100" y2="600"/>
				<line x1="120" y1="0" x2="115" y2="600"/>
				<line x1="140" y1="0" x2="135" y2="600"/>
				<line x1="158" y1="0" x2="153" y2="600"/>
				<line x1="172" y1="0" x2="168" y2="600"/>
				<line x1="188" y1="0" x2="184" y2="600"/>
			</g>

			<!-- dark shadow lines (folds) -->
			<g opacity="0.22" fill="none" stroke="rgba(5,5,5,1)" stroke-width="2.5">
				<line x1="14"  y1="0" x2="12"  y2="600"/>
				<line x1="29"  y1="0" x2="26"  y2="600"/>
				<line x1="45"  y1="0" x2="42"  y2="600"/>
				<line x1="61"  y1="0" x2="57"  y2="600"/>
				<line x1="78"  y1="0" x2="74"  y2="600"/>
				<line x1="96"  y1="0" x2="91"  y2="600"/>
				<line x1="112" y1="0" x2="107" y2="600"/>
				<line x1="128" y1="0" x2="123" y2="600"/>
				<line x1="146" y1="0" x2="141" y2="600"/>
				<line x1="163" y1="0" x2="158" y2="600"/>
				<line x1="178" y1="0" x2="173" y2="600"/>
				<line x1="194" y1="0" x2="189" y2="600"/>
			</g>

			<!-- horizontal weave lines -->
			<g opacity="0.06" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.5">
				<line x1="0" y1="30"  x2="200" y2="32"/> <line x1="0" y1="60"  x2="200" y2="58"/>
				<line x1="0" y1="90"  x2="200" y2="92"/> <line x1="0" y1="120" x2="200" y2="118"/>
				<line x1="0" y1="150" x2="200" y2="152"/><line x1="0" y1="180" x2="200" y2="178"/>
				<line x1="0" y1="210" x2="200" y2="212"/><line x1="0" y1="240" x2="200" y2="238"/>
				<line x1="0" y1="270" x2="200" y2="272"/><line x1="0" y1="300" x2="200" y2="298"/>
				<line x1="0" y1="330" x2="200" y2="332"/><line x1="0" y1="360" x2="200" y2="358"/>
				<line x1="0" y1="390" x2="200" y2="392"/><line x1="0" y1="420" x2="200" y2="418"/>
				<line x1="0" y1="450" x2="200" y2="452"/><line x1="0" y1="480" x2="200" y2="478"/>
				<line x1="0" y1="510" x2="200" y2="512"/><line x1="0" y1="540" x2="200" y2="538"/>
				<line x1="0" y1="570" x2="200" y2="572"/>
			</g>

			<!-- animated fabric movement -->
			<g opacity="0.12">
				<path fill="rgba(60,60,60,0.2)">
				<animate attributeName="d" dur="4s" repeatCount="indefinite"
					values="M0,0 C30,100 -20,200 25,300 C-10,400 35,500 0,600 L0,0;
							M0,0 C-20,100 35,200 -15,300 C30,400 -10,500 20,600 L0,0;
							M0,0 C25,100 -15,200 30,300 C-20,400 25,500 -10,600 L0,0;
							M0,0 C-15,100 20,200 -20,300 C35,400 -15,500 25,600 L0,0;
							M0,0 C30,100 -20,200 25,300 C-10,400 35,500 0,600 L0,0"/>
				</path>
				<path fill="rgba(40,40,40,0.15)">
				<animate attributeName="d" dur="5.5s" repeatCount="indefinite"
					values="M200,0 C170,100 220,200 175,300 C210,400 165,500 200,600 L200,0;
							M200,0 C220,100 165,200 215,300 C170,400 210,500 180,600 L200,0;
							M200,0 C175,100 215,200 170,300 C215,400 170,500 205,600 L200,0;
							M200,0 C215,100 175,200 220,300 C175,400 215,500 175,600 L200,0;
							M200,0 C170,100 220,200 175,300 C210,400 165,500 200,600 L200,0"/>
				</path>
			</g>
			<rect x="190" width="10" height="600" fill="rgba(80,80,80,0.15)" filter="url(#fabricBlur)"/>
			</svg>
		</div>
    </div>

    <div id="toast"></div>

    <div id="controls">
      <input id="url-input" type="text" placeholder="YouTube URL or video ID…" autocomplete="off" spellcheck="false"/>
      <button class="ctrl-btn" id="play-btn">&#9654; Play</button>
      <button class="ctrl-btn" id="full-btn">&#10562;</button>
    </div>

  </div><!-- /stage -->
</div><!-- /theatre -->

<script src="app.js"></script>
</body>
</html>
