<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Georeferenced High-resolution image viewer with live coordinates">
  <title>Georeferenced Basemap Viewer</title>
  <!-- Include Proj4.js for coordinate transformations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --border: #334155;
      --text-primary: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background: var(--bg-primary);
      position: relative;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.3);
      border-bottom: 1px solid rgba(51, 65, 85, 0.15);
      flex-shrink: 0;
      gap: 16px;
      z-index: 10;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      backdrop-filter: blur(2px);
    }

    .toolbar-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--bg-primary);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: white;
    }

    .viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
      background: var(--bg-primary);
      cursor: grab;
      padding-top: 56px;
    }

    .viewport.dragging {
      cursor: grabbing;
    }

    .image-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
    }

    #imageElement {
      display: block;
      max-width: none;
      max-height: none;
      width: auto;
      height: auto;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      pointer-events: none;
      flex-shrink: 0;
    }

    .zoom-scale {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
      pointer-events: auto;
    }

    .zoom-track {
      width: 4px;
      height: 200px;
      background: rgba(148, 163, 184, 0.2);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .zoom-center-marker {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 50%;
      width: 12px;
      height: 2px;
      background: #ff1744;
      border-radius: 1px;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(255, 23, 68, 0.4);
    }

    .zoom-fill {
      position: absolute;
      width: 100%;
      bottom: 0;
      background: linear-gradient(to top, #ff1744, #ff5252);
      border-radius: 2px;
      transition: none;
      pointer-events: none;
      box-shadow: 0 0 12px rgba(255, 23, 68, 0.3);
    }

    .zoom-handle {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      background: #ff1744;
      border: 2px solid var(--bg-secondary);
      border-radius: 50%;
      cursor: grab;
      top: 0;
      transition: box-shadow 0.2s ease;
      box-shadow: 0 2px 12px rgba(255, 23, 68, 0.6);
    }

    .zoom-handle:hover {
      box-shadow: 0 2px 16px rgba(255, 23, 68, 0.8);
    }

    .zoom-handle.dragging {
      cursor: grabbing;
      box-shadow: 0 2px 20px rgba(255, 23, 68, 1);
    }

    .zoom-labels {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
      color: #ff1744;
      text-align: center;
      min-width: 50px;
      margin: -6px 0;
      font-weight: 600;
      text-shadow: 0 0 8px rgba(255, 23, 68, 0.3);
    }

    .zoom-label {
      line-height: 1;
    }

    .info-panel {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12px;
      color: var(--text-muted);
      backdrop-filter: blur(8px);
      pointer-events: none;
      text-align: right;
      z-index: 5;
    }

    .info-row {
      display: flex;
      gap: 12px;
      margin-bottom: 4px;
      justify-content: flex-end;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      color: var(--text-muted);
      min-width: 70px;
    }

    .info-value {
      color: var(--text-primary);
      font-weight: 500;
      font-family: 'SF Mono', Monaco, monospace;
    }

    .status-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px 28px;
      font-size: 14px;
      color: var(--text-primary);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 5;
      text-align: center;
      max-width: 340px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      pointer-events: auto;
    }

    .status-text {
      line-height: 1.5;
    }

    .status-close {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .status-close:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .hidden {
      display: none !important;
    }

    .file-input-wrapper {
      position: relative;
      display: inline-block;
      overflow: hidden;
    }

    input[type="file"] {
      position: absolute;
      left: -9999px;
    }

    @media (max-width: 480px) {
      .toolbar {
        padding: 10px 12px;
        gap: 12px;
      }

      .btn {
        padding: 6px 10px;
        font-size: 12px;
      }

      .info-panel {
        bottom: 12px;
        right: 12px;
        padding: 10px 12px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="toolbar">
      <div class="toolbar-title" id="filename">Georeferenced Basemap Viewer</div>
      <div class="toolbar-actions">
        <div class="file-input-wrapper">
          <button class="btn" id="uploadMetaBtn">Open Metadata</button>
          <input type="file" id="metaFileInput" accept=".json">
        </div>
        <div class="file-input-wrapper">
          <button class="btn btn-primary" id="uploadBtn">Open Image</button>
          <input type="file" id="fileInput" accept="image/webp,image/jpeg,image/png,image/*">
        </div>
        <button class="btn" id="resetBtn" title="Reset view">Reset</button>
      </div>
    </div>

    <div class="viewport" id="viewport">
      <div class="image-wrapper" id="imageWrapper">
        <img id="imageElement" style="display: none;">
      </div>
      
      <div class="zoom-scale">
        <div class="zoom-labels">
          <div class="zoom-label">200%</div>
        </div>
        <div class="zoom-track" id="zoomTrack">
          <div class="zoom-center-marker"></div>
          <div class="zoom-fill" id="zoomFill"></div>
          <div class="zoom-handle" id="zoomHandle"></div>
        </div>
        <div class="zoom-labels">
          <div class="zoom-label">10%</div>
        </div>
      </div>
      
      <div class="info-panel" id="infoPanel">
        <div class="info-row">
          <span class="info-label">Size:</span>
          <span class="info-value" id="imageSize">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Zoom:</span>
          <span class="info-value" id="zoomLevel">100%</span>
        </div>
        <div class="info-row">
          <span class="info-label">Pixel:</span>
          <span class="info-value" id="pixelPos">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Lat, Lon:</span>
          <span class="info-value" id="geoCoord">Not georeferenced</span>
        </div>
      </div>
      
      <div class="status-message" id="statusMessage">
        <div class="status-text" id="statusText">Click <b>"Open Image"</b> to load your map image.</div>
        <button class="status-close hidden" id="statusClose">Continue without georeferencing</button>
      </div>
    </div>
  </div>

  <script>
    class ImageViewer {
      constructor() {
        this.imageElement = document.getElementById('imageElement');
        this.imageWrapper = document.getElementById('imageWrapper');
        this.viewport = document.getElementById('viewport');
        this.zoomHandle = document.getElementById('zoomHandle');
        this.zoomTrack = document.getElementById('zoomTrack');
        this.zoomFill = document.getElementById('zoomFill');
        this.zoomLevel = document.getElementById('zoomLevel');
        
        this.pan = { x: 0, y: 0 };
        this.zoom = 1;
        this.minZoom = 0.1;
        this.maxZoom = 2;
        this.isDragging = false;
        this.isZoomDragging = false;
        this.dragStart = { x: 0, y: 0 };
        this.snapThreshold = 0.08;
        
        this.metadata = null;
        this.projKey = null;

        this.fileInput = document.getElementById('fileInput');
        this.metaFileInput = document.getElementById('metaFileInput');
        this.uploadBtn = document.getElementById('uploadBtn');
        this.uploadMetaBtn = document.getElementById('uploadMetaBtn');
        this.resetBtn = document.getElementById('resetBtn');
        this.statusMessage = document.getElementById('statusMessage');
        this.statusText = document.getElementById('statusText');
        this.statusClose = document.getElementById('statusClose');
        this.filename = document.getElementById('filename');
        this.imageSize = document.getElementById('imageSize');
        this.pixelPos = document.getElementById('pixelPos');
        this.geoCoord = document.getElementById('geoCoord');
        
        this.setupEventListeners();
      }

      setupEventListeners() {
        this.fileInput.addEventListener('change', (e) => this.handleFileSelect(e));
        this.metaFileInput.addEventListener('change', (e) => this.handleMetaSelect(e));
        this.uploadBtn.addEventListener('click', () => this.fileInput.click());
        this.uploadMetaBtn.addEventListener('click', () => this.metaFileInput.click());
        this.resetBtn.addEventListener('click', () => this.resetView());
        this.statusClose.addEventListener('click', () => this.statusMessage.classList.add('hidden'));

        // Mouse drag & cursor coordinate tracking
        this.viewport.addEventListener('mousedown', (e) => this.startDrag(e));
        document.addEventListener('mousemove', (e) => this.handleMouseMove(e));
        document.addEventListener('mouseup', () => this.endDrag());

        // Touch drag
        this.viewport.addEventListener('touchstart', (e) => this.startDrag(e));
        this.viewport.addEventListener('touchmove', (e) => this.drag(e), { passive: false });
        this.viewport.addEventListener('touchend', () => this.endDrag());

        // Zoom scale events
        this.zoomHandle.addEventListener('mousedown', (e) => this.startZoomDrag(e));
        this.zoomHandle.addEventListener('touchstart', (e) => this.startZoomDrag(e));
        document.addEventListener('mousemove', (e) => this.zoomDrag(e));
        document.addEventListener('touchmove', (e) => this.zoomDrag(e), { passive: false });
        document.addEventListener('mouseup', () => this.endZoomDrag());
        document.addEventListener('touchend', () => this.endZoomDrag());

        this.zoomTrack.addEventListener('click', (e) => this.handleZoomTrackClick(e));
      }

      handleMetaSelect(e) {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            this.metadata = JSON.parse(event.target?.result);
            this.initProjection();
            this.uploadMetaBtn.textContent = 'Metadata Loaded ✓';
            this.uploadMetaBtn.style.borderColor = 'var(--accent)';
            this.statusMessage.classList.add('hidden');
          } catch (err) {
            alert('Invalid JSON metadata file.');
          }
        };
        reader.readAsText(file);
      }

      initProjection() {
        if (!this.metadata || !this.metadata.projection) return;
        const p = this.metadata.projection.parameters;
        
        const projStr = `+proj=lcc +lat_1=${p.standardParallel1} +lat_2=${p.standardParallel2} +lat_0=${p.latitudeOfOrigin} +lon_0=${p.centralMeridian} +x_0=${p.falseEasting} +y_0=${p.falseNorthing} +datum=WGS84 +units=m +no_defs`;
        this.projKey = 'CUSTOM_LCC_MAP';
        proj4.defs(this.projKey, projStr);
      }

      handleFileSelect(e) {
        const file = e.target.files?.[0];
        if (!file) return;

        this.statusText.textContent = 'Loading image...';
        this.statusClose.classList.add('hidden');
        this.statusMessage.classList.remove('hidden');

        const reader = new FileReader();
        reader.onload = (event) => {
          this.imageElement.onload = () => {
            const filenameWithoutExtension = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
            this.filename.textContent = filenameWithoutExtension;
            this.imageSize.textContent = `${this.imageElement.naturalWidth} × ${this.imageElement.naturalHeight}`;
            this.imageElement.style.display = 'block';

            // Image loaded successfully -> Prompt for optional metadata with a close button
            this.statusText.innerHTML = 'Image loaded successfully! Optional: load a <b>metadata JSON file</b> to enable georeferencing.';
            this.statusClose.classList.remove('hidden');
            this.statusMessage.classList.remove('hidden');

            this.resetView();
          };
          this.imageElement.onerror = () => {
            this.statusText.textContent = 'Failed to load image';
            this.statusClose.classList.add('hidden');
          };
          this.imageElement.src = event.target?.result;
        };
        reader.readAsDataURL(file);
      }

      startDrag(e) {
        if (this.imageElement.style.display === 'none') return;
        if (e.target === this.zoomHandle || this.zoomHandle.contains(e.target)) return;
        
        const touch = e.touches?.[0];
        const x = touch ? touch.clientX : e.clientX;
        const y = touch ? touch.clientY : e.clientY;
        
        this.isDragging = true;
        this.dragStart = { x, y };
        this.viewport.classList.add('dragging');
      }

      handleMouseMove(e) {
        if (this.isDragging) {
          this.drag(e);
          return;
        }

        if (this.imageElement.style.display === 'none') return;

        const rect = this.viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const viewportWidth = this.viewport.clientWidth;
        const viewportHeight = this.viewport.clientHeight;
        const scaledWidth = this.imageElement.naturalWidth * this.zoom;
        const scaledHeight = this.imageElement.naturalHeight * this.zoom;

        const imgLeft = (viewportWidth - scaledWidth) / 2 + this.pan.x;
        const imgTop = (viewportHeight - scaledHeight) / 2 + this.pan.y;

        const px = (mouseX - imgLeft) / this.zoom;
        const py = (mouseY - imgTop) / this.zoom;

        if (px >= 0 && px <= this.imageElement.naturalWidth && py >= 0 && py <= this.imageElement.naturalHeight) {
          this.pixelPos.textContent = `${Math.round(px)}, ${Math.round(py)}`;
          
          if (this.metadata && this.projKey) {
            const wf = this.metadata.worldFile;
            const easting = wf.easting + (px * wf.pixelWidth) + (py * (wf.rotationX || 0));
            const northing = wf.northing + (px * (wf.rotationY || 0)) + (py * wf.pixelHeight);

            try {
              const [lon, lat] = proj4(this.projKey, 'WGS84', [easting, northing]);
              this.geoCoord.textContent = `${lat.toFixed(4)}°, ${lon.toFixed(4)}°`;
            } catch (err) {
              this.geoCoord.textContent = 'Transformation error';
            }
          } else {
            this.geoCoord.textContent = 'No metadata loaded';
          }
        } else {
          this.pixelPos.textContent = '-';
          this.geoCoord.textContent = this.metadata ? 'Out of bounds' : 'No metadata loaded';
        }
      }

      drag(e) {
        if (!this.isDragging) return;
        e.preventDefault?.();
        
        const touch = e.touches?.[0];
        const x = touch ? touch.clientX : e.clientX;
        const y = touch ? touch.clientY : e.clientY;
        
        this.pan.x += (x - this.dragStart.x);
        this.pan.y += (y - this.dragStart.y);
        
        this.dragStart = { x, y };
        this.constrainPan();
        this.updateTransform();
      }

      endDrag() {
        this.isDragging = false;
        this.viewport.classList.remove('dragging');
      }

      constrainPan() {
        const viewportWidth = this.viewport.clientWidth;
        const viewportHeight = this.viewport.clientHeight;
        
        const scaledWidth = this.imageElement.naturalWidth * this.zoom;
        const scaledHeight = this.imageElement.naturalHeight * this.zoom;
        
        const maxPanX = Math.max(0, (scaledWidth - viewportWidth) / 2);
        const maxPanY = Math.max(0, (scaledHeight - viewportHeight) / 2);

        this.pan.x = Math.max(-maxPanX, Math.min(maxPanX, this.pan.x));
        this.pan.y = Math.max(-maxPanY, Math.min(maxPanY, this.pan.y));
      }

      updateTransform() {
        this.imageWrapper.style.transform = `translate(${this.pan.x}px, ${this.pan.y}px) scale(${this.zoom})`;
      }

      resetView() {
        this.pan = { x: 0, y: 0 };
        this.zoom = 1;
        this.updateTransform();
        this.updateZoomScale();
      }

      startZoomDrag(e) {
        e.stopPropagation();
        this.isZoomDragging = true;
        this.zoomHandle.classList.add('dragging');
      }

      zoomDrag(e) {
        if (!this.isZoomDragging || this.imageElement.style.display === 'none') return;
        
        const track = this.zoomTrack.getBoundingClientRect();
        const relativeY = Math.max(0, Math.min(track.height, (e.touches?.[0]?.clientY || e.clientY) - track.top));
        const normalizedValue = 1 - (relativeY / track.height);
        
        if (Math.abs(normalizedValue - 0.5) < this.snapThreshold) {
          this.zoom = 1;
        } else {
          this.zoom = this.minZoom + (this.maxZoom - this.minZoom) * normalizedValue;
        }
        
        this.constrainPan();
        this.updateTransform();
        this.updateZoomScale();
      }

      endZoomDrag() {
        this.isZoomDragging = false;
        this.zoomHandle.classList.remove('dragging');
      }

      handleZoomTrackClick(e) {
        const track = this.zoomTrack.getBoundingClientRect();
        const relativeY = Math.max(0, Math.min(track.height, e.clientY - track.top));
        const normalizedValue = 1 - (relativeY / track.height);
        
        if (Math.abs(normalizedValue - 0.5) < this.snapThreshold) {
          this.zoom = 1;
        } else {
          this.zoom = this.minZoom + (this.maxZoom - this.minZoom) * normalizedValue;
        }
        
        this.constrainPan();
        this.updateTransform();
        this.updateZoomScale();
      }

      updateZoomScale() {
        const normalizedZoom = (this.zoom - this.minZoom) / (this.maxZoom - this.minZoom);
        this.zoomHandle.style.top = ((1 - normalizedZoom) * 100) + '%';
        this.zoomFill.style.height = (normalizedZoom * 100) + '%';
        this.zoomLevel.textContent = Math.round(this.zoom * 100) + '%';
      }
    }

    new ImageViewer();
  </script>
</body>
</html>
