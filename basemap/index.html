<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Georeferenced High-resolution image viewer with live coordinates">
  <title>Georeferenced Basemap Viewer</title>
  
  <!-- PWA Manifest & Favicon -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">

  <!-- Proj4.js CDN for Coordinate Transformation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>
  
  <!-- App Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div class="toolbar">
      <div class="toolbar-title" id="filename">Georeferenced Basemap Viewer</div>
      <div class="toolbar-actions">
        <div class="file-input-wrapper">
          <button class="btn" id="uploadMetaBtn">Open Metadata</button>
          <input type="file" id="metaFileInput" accept=".json">
        </div>
        <div class="file-input-wrapper">
          <button class="btn btn-primary" id="uploadBtn">Open Image</button>
          <input type="file" id="fileInput" accept="image/webp,image/jpeg,image/png,image/*">
        </div>
        <button class="btn" id="resetBtn" title="Reset view">Reset</button>
      </div>
    </div>

    <div class="viewport" id="viewport">
      <div class="image-wrapper" id="imageWrapper">
        <img id="imageElement" style="display: none;" alt="Basemap">
      </div>
      
      <div class="zoom-scale">
        <div class="zoom-labels">
          <div class="zoom-label">200%</div>
        </div>
        <div class="zoom-track" id="zoomTrack">
          <div class="zoom-center-marker"></div>
          <div class="zoom-fill" id="zoomFill"></div>
          <div class="zoom-handle" id="zoomHandle"></div>
        </div>
        <div class="zoom-labels">
          <div class="zoom-label">10%</div>
        </div>
      </div>
      
      <div class="info-panel" id="infoPanel">
        <div class="info-row">
          <span class="info-label">Size:</span>
          <span class="info-value" id="imageSize">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Zoom:</span>
          <span class="info-value" id="zoomLevel">100%</span>
        </div>
        <div class="info-row">
          <span class="info-label">Pixel:</span>
          <span class="info-value" id="pixelPos">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Lat, Lon:</span>
          <span class="info-value" id="geoCoord">Not georeferenced</span>
        </div>
      </div>
      
      <div class="status-message" id="statusMessage">
        <div class="status-text" id="statusText">Click <b>"Open Image"</b> to load your map image.</div>
        <button class="status-close hidden" id="statusClose">Continue without georeferencing</button>
      </div>
    </div>
  </div>

  <!-- App Script -->
  <script src="app.js"></script>
  <script>
    // Register Service Worker for PWA offline capabilities
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered successfully:', reg.scope))
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
