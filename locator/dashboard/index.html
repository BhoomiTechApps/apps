<!DOCTYPE html>
<html>
<head>
  <title>BhoomiTech Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  <style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    font-size: 14px; /* smaller text for all content */
  }
  .header-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: #f5f5f5;
    box-sizing: border-box;
  }
  .header-container h3 {
    margin: 0;
    text-align: center;
    flex: 1; /* Center header */
    font-size: 18px;
  }
  .header-container button {
    padding: 8px 14px;
    background: #c62828;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  .content {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    box-sizing: border-box;
  }
  input[type="text"],
  #map,
  button.export-btn,
  table {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 10px;
  }
  #map {
    width: 100%;
    height: 50vh;
    margin-bottom: 10px;
  }
  #search {
    padding: 10px;
    font-size: 16px;
    border-radius: 5px;
  }
  button.export-btn {
    padding: 8px 14px;
    margin-bottom: 10px;
	color: white;
	border: none;
	background: #00695c;
    font-size: 14px;
	border-radius: 5px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 6px 8px;
    text-align: left;
  }
  .delete-btn {
    padding: 6px 10px;
    background: #c62828;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  .delete-btn:hover {
    background: #b71c1c;
  }
.custom-cluster {
  background: rgba(0, 105, 92, 0.85);
  border-radius: 50%;
  border: 3px solid white;
  color: white;
  font-weight: bold;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
}
.custom-cluster div {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.custom-cluster span {
  font-size: 16px;
}
.custom-cluster-small {
  width: 40px;
  height: 40px;
}
.custom-cluster-medium {
  width: 50px;
  height: 50px;
}
.custom-cluster-large {
  width: 60px;
  height: 60px;
}	  
  @media (max-width: 768px) {
    .header-container h3 {
      font-size: 16px;
    }
    .header-container button {
      padding: 6px 10px;
      font-size: 12px;
    }
  }
</style>
  <script type="module" crossorigin src="../assets/dashboard-CdaAg7P4.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body>
<div class="header-container">
  <h3>BhoomiTech Admin Dashboard</h3>
  <button onclick="logout()">Logout</button>
</div>
<div class="content">
  <input type="text" id="search" placeholder="Search name or phone">
  <div id="map"></div>
  <button class="export-btn" onclick="exportCSV()">Export CSV</button>
  <table id="dataTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Description</th>
        <th>Date</th>
		<th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
</body>

</body>
</html>
