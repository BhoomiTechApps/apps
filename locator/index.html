<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeoTag Pro Mapper</title>
	<link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="stylesheet" href="leaflet.css" />
    <link rel="stylesheet" href="Control.Geocoder.css" />
    <link rel="stylesheet" href="styles.css">
    <script src="leaflet.js"></script>
    <script src="Control.Geocoder.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js', { scope: '/apps/locator/' })
            .then(reg => console.log("SW registered", reg))
            .catch(err => console.log("SW registration failed", err));
        });
      }
    </script>
</head>
<body>
<div id="app-container">
    <div id="map"></div>
    <div class="top-status">
        <span id="coord-display">🛰️ Initializing GPS...</span>
    </div>
    <button id="fab-camera" onclick="openCameraPopup()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <circle cx="12" cy="13" r="3"></circle>
        </svg>
    </button>
    <button id="fab-upload" onclick="openUploadPopup()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
    </button>
    <button class="settings-btn" onclick="showSettings()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m6.08 0l4.24-4.24M1 12h6m6 0h6m-1.78 7.78l-4.24-4.24m-6.08 0l-4.24 4.24"></path>
        </svg>
    </button>
    <div id="camera-popup" class="popup-overlay">
        <div class="popup-content">
            <button class="close-btn" onclick="closeCameraPopup()">✕</button>
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>            
            <div class="form-group">
                <input type="text" id="phone" placeholder="Phone Number">
                <textarea id="desc" placeholder="Enter site observations..."></textarea>
                <input type="hidden" id="lat">
                <input type="hidden" id="lng">
            </div>
            <button id="save-idb-btn" class="main-btn">Save to Queue</button>
            <div class="popup-coords-text">
                Current Location: <span id="popup-coords">Detecting...</span>
            </div>
        </div>
    </div>
    <div id="upload-popup" class="popup-overlay">
      <div class="popup-content">
        <button class="close-btn" onclick="closeUploadPopup()">✕</button>      
        <div id="file-preview-container">
            <img id="file-preview" src="" alt="Preview">
            <div id="placeholder-text">No image selected</div>
        </div>
        <button class="main-btn btn-secondary" onclick="triggerFileInput()">
            Choose Image
        </button>
        <div class="form-group">
            <input type="text" id="phone-upload" placeholder="Phone Number">
            <textarea id="desc-upload" placeholder="Enter site observations..."></textarea>
        </div>
        <button id="save-upload-btn" class="main-btn">Save to Queue</button>
      </div>
    </div>
    <div id="settings-view" class="popup-overlay">
        <div class="popup-content">
            <button class="close-btn" onclick="closeSettings()">✕</button>
            <h5>Local Queue Management</h5>
            <div id="queue-list">
                <p>No pending captures.</p>
            </div>
        </div>
    </div>
</div> <script src="scripts.js"></script>
</body>
</html>
