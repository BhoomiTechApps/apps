<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Geo Image Viewer</title>

<!-- Leaflet -->
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Marker Cluster -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<!-- Plugins -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen@1.6.0/Control.FullScreen.css"/>
<script src="https://unpkg.com/leaflet.fullscreen@1.6.0/Control.FullScreen.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css"/>
<script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"/>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

</head>

<body>

<div id="top-bar">
  <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none;">
  
  <button id="openJsonBtn" title="Select Project Folder" style="background:#A8A8A8; border:none; padding:8px; cursor:pointer; border-radius:4px; display:flex; align-items:center;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 18V6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10" stroke="#000" stroke-width="2" fill="none"/>
      <path d="M3 12h18l-2 6H5l-2-6z" stroke="#000" stroke-width="2" fill="none"/>
    </svg>
    <span style="margin-left:8px; font-size:12px; font-weight:bold;">LOAD FOLDER</span>
  </button>

  <div style="display:flex; align-items:center; gap:8px;">
    <span class="radius-label">Radius:</span>
    <input type="range" id="radius" min="1" max="50" value="10" style="width:100px;">
    <span class="radius-value"><span id="radiusValue">10</span> km</span>
  </div>
</div>

<div id="main-container">
  <div id="map"></div>
  <div id="gallery">
    <div id="results"><p style="color:#888; font-size:12px;">Select a folder to start...</p></div>
  </div>
</div>

<div id="lightbox" onclick="this.style.display='none'">
  <img id="lightboxImg" src="">
</div>
</body>

<script src="scripts.js"></script>
</html>
