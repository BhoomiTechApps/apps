<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Geo Image Viewer</title>

<!-- Leaflet -->
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Marker Cluster -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<!-- Plugins -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen@1.6.0/Control.FullScreen.css"/>
<script src="https://unpkg.com/leaflet.fullscreen@1.6.0/Control.FullScreen.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css"/>
<script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"/>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

</head>

<body>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<div id="top-bar">
  <div class="app-title">GeoImg</div>
  <div class="toolbar-actions">
    <div class="radius-control">
      <input type="range" id="radius" min="1" max="50" value="10">
      <span class="radius-value"><span id="radiusValue">10</span> km</span>
    </div>
	<input type="file" id="folderInput" webkitdirectory directory multiple style="display:none;">
    <button id="openJsonBtn" class="tool-btn" title="Load Project Folder">
      <i class="fa-solid fa-folder-open"></i>
    </button>
    <button class="tool-btn editor-link" onclick="window.location.href='editor/index.html'" title="Open Editor">
       <i class="fa-solid fa-pen-to-square"></i>
    </button>
	<button class="tool-btn exit-btn" onclick="location.reload()" title="Exit & Reset">
      <i class="fa-solid fa-xmark"></i>
  </div>
</div>

<div id="main-container">
  <div id="map"></div>
  <div id="gallery">
    <div id="results"><p style="color:#888; font-size:12px;">Select a folder to start...</p></div>
  </div>
</div>

<div id="lightbox" onclick="this.style.display='none'">
  <div id="lightbox-content">
    <img id="lightboxImg" src="">
    <div id="lightboxCaption"></div>
  </div>
</div>

</body>

<script src="scripts.js"></script>
</html>
