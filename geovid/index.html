<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoVid Viewer</title>
    <link rel="icon" type="image/png" href="/apps/geovid/favicon.png">
    <link rel="manifest" href="/apps/geovid/manifest.json">
    <link rel="apple-touch-icon" href="/apps/geovid/icon-192.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css">
    <link rel="stylesheet" href="styles.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
</head>
<body>

<div id="app">
    <div id="toolbar">
        <div class="app-title">GeoVid Viewer</div>
        <div class="tool-group">
            <span id="project-name" style="font-size: 11px; color: #777; margin-right: 10px;"></span>
            <button class="tool-btn" onclick="loadJson()" title="Open Playlist">
                <i class="fa-solid fa-folder-open"></i>
            </button>
        </div>
    </div>

    <div id="preview">
        <div class="preview-box">
            <div id="map"></div>
        </div>
    </div>

    <div id="table-container"></div>

    <input type="file" id="fileInput" style="display:none" accept=".json" onchange="handleFileSelect(event)">
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <div class="lightbox-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <div id="lightbox-video-container"></div>
    </div>
</div>

<script src="scripts.js"></script>
</body>
</html>
