<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>GeoCam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="viewer">
      <video id="preview" autoplay muted playsinline></video>
      <div class="hud">
        <span><span id="recDot" class="dot"></span><span id="timer">00:00</span></span>
        <span id="gpsInfo">GPS: waiting</span>
      </div>
    </section>

    <section class="controls">
      <select id="cameraSelect" aria-label="Camera">
        <option value="">Automatic (back camera on phones)</option>
      </select>
      <button id="startCam">Start camera</button>
      <button id="recordBtn" class="record" disabled>Record</button>
    </section>

    <section class="settings">
      <label class="check">
        <input type="checkbox" id="netFallback">
        Use mobile network location when GPS is weak or unavailable
      </label>
      <label class="row">
        Treat GPS as weak when accuracy is worse than
        <select id="weakAcc" aria-label="Weak GPS threshold">
          <option value="20">20 m</option>
          <option value="50">50 m</option>
          <option value="100">100 m</option>
          <option value="250">250 m</option>
        </select>
      </label>
      <p class="hint">Network location comes from cell towers and Wi-Fi through your phone. It needs mobile
        signal and usually mobile data, and is typically accurate to 100 m–2 km. Points are labelled
        <code>gps</code> or <code>network</code> in the GeoJSON.</p>
    </section>

    <p id="status" role="status"></p>
    <p id="offlineBadge" class="badge">Checking offline readiness…</p>

    <section class="recordings">
      <div class="rec-head">
        <h2>Recordings</h2>
        <span id="storage" class="muted"></span>
      </div>
      <ul id="list"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
