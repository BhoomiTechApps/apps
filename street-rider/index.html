<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Journey Lite</title>
<meta name="description" content="Play a motorcycle ride through your own map points.">
<meta name="theme-color" content="#1d1e20" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#d8d5ce" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">

  <header class="bar">
    <button class="ib only-narrow" id="panelBtn" title="Show panel" aria-label="Show panel" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">
      <img src="icons/motorcycle.svg" alt="" width="12" height="24">
      <span>Street Journey <b>Lite</b></span>
    </div>

    <div class="transport">
      <button class="ib primary" id="playBtn" title="Play" aria-label="Play" disabled>
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor" stroke="none"/></svg>
        <span class="spin" aria-hidden="true"></span>
      </button>
      <button class="ib" id="restartBtn" title="Back to start" aria-label="Back to start" disabled>
        <svg viewBox="0 0 24 24"><path d="M5 5v14M19 5l-10 7 10 7z"/></svg>
      </button>
      <button class="ib toggle" id="followBtn" title="Follow the motorcycle" aria-label="Follow the motorcycle" aria-pressed="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="7.5"/></svg>
      </button>
      <label class="speed" title="Speed">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4.5-5"/></svg>
        <input type="range" id="speed" min="0" max="10" step="1" value="5" aria-label="Speed">
        <output id="speedOut">25×</output>
      </label>
    </div>

    <button class="ib" id="installBtn" title="Install app" aria-label="Install app" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>
    </button>
  </header>

  <aside class="panel" id="panel">
    <section class="sec">
      <h2>Basemap</h2>
      <select id="basemap" aria-label="Basemap"></select>
    </section>

    <section class="sec">
      <h2>Points file</h2>
      <div class="row">
        <select id="setSelect" aria-label="Saved point files"><option value="">No files yet</option></select>
        <button class="ib danger" id="deleteSetBtn" title="Remove this file from the app" aria-label="Remove this file from the app" disabled>
          <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"/></svg>
        </button>
      </div>
      <label class="btn wide" for="fileInput">
        <svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 20h14"/></svg>
        Open JSON from device
      </label>
      <input type="file" id="fileInput" accept=".json,.geojson,application/json,application/geo+json" hidden>
      <p class="hint" id="setHint">Files you open are kept in this browser, so you can pick them again offline.</p>
    </section>

    <section class="sec grow">
      <div class="sec-head">
        <h2>Stops <span class="count" id="stopCount"></span></h2>
        <div class="mini">
          <button class="link" id="allBtn" disabled>All</button>
          <button class="link" id="clearBtn" disabled>Clear</button>
        </div>
      </div>
      <input type="search" id="search" placeholder="Search points" aria-label="Search points" disabled>
      <ol class="plist" id="plist"></ol>
      <p class="hint" id="listHint">Tap points in the list or on the map, in the order you want to ride.</p>
    </section>

    <section class="sec">
      <h2>Ride</h2>
      <label class="check"><input type="checkbox" id="roads" checked> Follow roads <span class="faint">(needs internet)</span></label>
      <label class="field">Pause at each stop
        <select id="pause">
          <option value="0">Don't pause</option>
          <option value="1000">1 second</option>
          <option value="2000" selected>2 seconds</option>
          <option value="3500">3.5 seconds</option>
          <option value="6000">6 seconds</option>
        </select>
      </label>
    </section>
  </aside>

  <main class="stage">
    <div id="map" aria-label="Map"></div>

    <div class="card" id="card" hidden>
      <img id="cardImg" alt="">
      <div class="card-txt">
        <span class="card-n" id="cardN"></span>
        <span class="card-l" id="cardL"></span>
      </div>
    </div>

    <div class="progress" id="progress" hidden>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Ride position">
      <div class="readout"><span id="done">0 km</span><span id="left"></span></div>
    </div>

    <div class="empty" id="empty">
      <img src="icons/motorcycle.svg" alt="" width="28" height="56">
      <p>Open a JSON file of points to start.</p>
      <div class="row center">
        <label class="btn primary" for="fileInput">Open JSON</label>
        <button class="btn" id="sampleBtn">Try the sample</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
