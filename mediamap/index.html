<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Media Map</title>
<meta name="description" content="Pin photos, video, audio, documents and notes to places, with your own map layers. Everything is saved on your device.">
<meta name="theme-color" content="#1B2A3A">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Media Map">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<link rel="stylesheet" href="vendor/leaflet/leaflet.min.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.Default.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="bar">
    <a class="brand" href="./" aria-label="Media Map home">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.6A2.6 2.6 0 1 1 12 6.4a2.6 2.6 0 0 1 0 5.2z"/></svg>
        <span>Media Map</span>
    </a>
    <button type="button" class="where" id="where" hidden title="Where your data is saved">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span id="where-name"></span>
    </button>
    <span class="offline-chip" id="offline-chip" hidden>Offline</span>
    <nav class="bar-actions">
        <button type="button" class="icon-btn" id="btn-list" aria-label="Entries" title="Entries">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 6h2v2H4zm4 0h12v2H8zM4 11h2v2H4zm4 0h12v2H8zm-4 5h2v2H4zm4 0h12v2H8z"/></svg>
        </button>
        <button type="button" class="icon-btn" id="btn-layers" aria-label="Map layers" title="Map layers">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="m12 3 10 5.5-10 5.5L2 8.5zm-7.7 9.3L12 16.5l7.7-4.2 2.3 1.2-10 5.5-10-5.5z"/></svg>
        </button>
        <button type="button" class="icon-btn" id="btn-settings" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.3 7.3 0 0 0-1.7-1L15 3.5h-4L10.7 6a7.3 7.3 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.3 7.3 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7.3 7.3 0 0 0 1.7-1l2.4 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        </button>
    </nav>
</header>

<main class="stage">
    <div id="map" role="application" aria-label="Map"></div>

    <div class="pick-hint" id="pick-hint" hidden>Tap the map to place the pin</div>

    <div class="fabs">
        <button type="button" class="fab fab-small" id="btn-locate" aria-label="Show my location" title="Show my location">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 3h-2.1A7 7 0 0 0 13 5.1V3h-2v2.1A7 7 0 0 0 5.1 11H3v2h2.1a7 7 0 0 0 5.9 5.9V21h2v-2.1a7 7 0 0 0 5.9-5.9H21zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
        </button>
        <button type="button" class="fab fab-add" id="btn-add">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
            <span>Add a place</span>
        </button>
    </div>

    <aside class="sheet" id="sheet" hidden aria-labelledby="sheet-title">
        <div class="sheet-head">
            <button type="button" class="icon-btn sheet-back" id="sheet-back" hidden aria-label="Back">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M15.4 6.4 14 5l-7 7 7 7 1.4-1.4L9.8 12z"/></svg>
            </button>
            <h2 id="sheet-title"></h2>
            <button type="button" class="icon-btn" id="sheet-close" aria-label="Close">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="m18.3 7.1-1.4-1.4-4.9 4.9-4.9-4.9-1.4 1.4 4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9z"/></svg>
            </button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
    </aside>
</main>

<section class="welcome" id="welcome" hidden aria-labelledby="welcome-title">
    <div class="welcome-card" id="welcome-card"></div>
</section>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo">
    <button type="button" class="icon-btn lightbox-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="m18.3 7.1-1.4-1.4-4.9 4.9-4.9-4.9-1.4 1.4 4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9z"/></svg>
    </button>
    <img alt="">
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<input type="file" id="import-input" accept=".zip,.json,.geojson,application/zip,application/json,application/geo+json" hidden>

<noscript><p class="noscript">Media Map needs JavaScript to run.</p></noscript>

<script src="vendor/leaflet/leaflet.min.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
